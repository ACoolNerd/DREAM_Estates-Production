name: Gia Michele Web CI

on:
  pull_request:
    paths:
      - 'apps/gia-michele-web/**'
      - '.github/workflows/gia-michele-ci.yml'
  push:
    branches:
      - 'agent/gia-michele-platform-v1'
    paths:
      - 'apps/gia-michele-web/**'
      - '.github/workflows/gia-michele-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gia-michele-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
